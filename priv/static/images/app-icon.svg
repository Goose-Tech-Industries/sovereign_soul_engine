<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Concentric Rune Circles of Feannag's Rest -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="90" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Center Sovereign Crown / Raven Sigil -->
  <path d="M 200 290 L 220 220 L 256 260 L 292 220 L 312 290 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="210" r="10" fill="#fef08a" filter="url(#glow)" />
  <circle cx="210" cy="216" r="8" fill="#f59e0b" />
  <circle cx="302" cy="216" r="8" fill="#f59e0b" />

  <!-- Radial Cardinal Spikes -->
  <line x1="256" y1="56" x2="256" y2="96" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="456" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="56" y1="256" x2="96" y2="256" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="416" y1="256" x2="456" y2="256" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Pulse Core Node -->
  <circle cx="256" cy="280" r="6" fill="#38bdf8" filter="url(#glow)" />
</svg>
